name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
  CARGO_PROFILE_RELEASE_STRIP: "true"
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "s"
  CARGO_PROFILE_RELEASE_LTO: "fat"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned toolchain
        id: tc
        shell: bash
        run: |
          v=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml | head -1)
          echo "pin=$v" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tc.outputs.pin }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          shared-key: release-slim-v2

      # Match the official pipeline (setup-msvc-env.ps1): prefer the Rust
      # toolchain's bundled rust-lld over MSVC link.exe. rustc infers lld
      # flavor from the "rust-lld" file name and still injects the MSVC
      # LIB/INCLUDE/PATH env into the linker process (get_linker in
      # rustc_codegen_ssa/src/back/linker.rs), so no VsDevCmd step is needed
      # for this x64 native build.
      - name: Prefer rust-lld as linker (match official)
        shell: pwsh
        run: |
          $sysroot = (rustc --print sysroot).Trim()
          $lld = Join-Path $sysroot "lib\rustlib\x86_64-pc-windows-msvc\bin\rust-lld.exe"
          if (-not (Test-Path $lld)) { throw "rust-lld not found at $lld" }
          Write-Output "Using Windows linker: $lld"
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$lld" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build codex + sandbox helpers (x64)
        shell: bash
        working-directory: codex-rs
        env:
          STABLE_GIT_COMMIT: ${{ github.sha }}
        run: |
          cargo build --release --locked \
            --bin codex --bin codex-windows-sandbox-setup --bin codex-command-runner

      - name: Show binary sizes
        shell: pwsh
        run: |
          Get-ChildItem codex-rs/target/release/*.exe |
            Where-Object Name -in 'codex.exe','codex-windows-sandbox-setup.exe','codex-command-runner.exe' |
            ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Package
        shell: pwsh
        run: |
          $bin = "codex-rs/target/release"
          Compress-Archive -Path "$bin/codex.exe","$bin/codex-windows-sandbox-setup.exe","$bin/codex-command-runner.exe" -DestinationPath "codex-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: codex-windows-x64
          path: |
            codex-rs/target/release/codex.exe
            codex-rs/target/release/codex-windows-sandbox-setup.exe
            codex-rs/target/release/codex-command-runner.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: codex-windows-x64.zip
